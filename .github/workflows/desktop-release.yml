name: Desktop release

# Desktop releases are separate from CLI releases (ADR 0009): they run on
# `desktop-v*` tags and publish their own GitHub release. The CLI's GoReleaser
# release on `v*` tags, and `zenith update`, are unaffected.

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
      - name: Create the release (idempotent)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --title "Zenith Desktop ${{ steps.v.outputs.version }} (beta)" \
            --notes-file .github/desktop-release-notes.md \
            --prerelease

  build:
    name: build (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, label: macos-arm64, goos: darwin, arch: arm64 }
          - { os: macos-14, label: macos-amd64, goos: darwin, arch: amd64 }
          - { os: windows-latest, label: windows-amd64, goos: windows, arch: amd64 }
          - { os: ubuntu-latest, label: linux-amd64, goos: linux, arch: amd64 }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Linux packaging dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev rpm fuse libfuse2
      - name: Windows installer tooling
        if: matrix.goos == 'windows'
        run: choco install nsis -y --no-progress

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Stamp the version
        run: |
          sed -i.bak "s|^var version = .*|var version = \"${VERSION}\"|" desktop/main.go
          rm -f desktop/main.go.bak

      - name: Package
        working-directory: desktop
        run: wails3 package ARCH=${{ matrix.arch }}

      # ---- macOS: optional signing and notarization (ADR 0009) -------------------
      # Enable by setting the repository variable DESKTOP_SIGN_MACOS=true. When it is
      # on, every secret below is required and the job FAILS if any is missing, so a
      # release can never silently ship unsigned while claiming to be signed.
      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin' && vars.DESKTOP_SIGN_MACOS == 'true'
        working-directory: desktop
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::signing is enabled (DESKTOP_SIGN_MACOS=true) but secret $name is missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          wails3 tool sign --input bin/Zenith.app --certificate "$RUNNER_TEMP/cert.p12" --password "$MACOS_CERT_PASSWORD" \
            --identity "$MACOS_SIGN_IDENTITY" --notarize \
            --notary-key "$RUNNER_TEMP/AuthKey.p8" --notary-key-id "$APPLE_API_KEY_ID" --notary-issuer-id "$APPLE_API_ISSUER_ID"
          spctl --assess --type execute --verbose=4 bin/Zenith.app
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Collect assets
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p ../assets
          name="Zenith-${VERSION}-${{ matrix.goos == 'darwin' && 'macos' || matrix.goos }}-${{ matrix.arch }}"
          case "${{ matrix.goos }}" in
            darwin)
              wails3 task darwin:create:dmg
              cp bin/Zenith.dmg "../assets/${name}.dmg" ;;
            windows)
              installer=$(ls bin/*installer*.exe | head -1)
              cp "$installer" "../assets/${name}.exe" ;;
            linux)
              cp "$(ls bin/*.AppImage | head -1)" "../assets/${name}.AppImage"
              cp "$(ls bin/*.deb | head -1)" "../assets/${name}.deb"
              cp "$(ls bin/*.rpm | head -1)" "../assets/${name}.rpm" ;;
          esac
          ls -la ../assets

      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" assets/* --clobber
