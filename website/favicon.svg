<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zenith">
  <defs>
    <linearGradient id="zg" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7D56F4"/>
      <stop offset="1" stop-color="#EE6FF8"/>
    </linearGradient>
  </defs>
  <!-- enso: the open zen circle, its gap facing the zenith -->
  <path d="M41.2 13.4 A23 23 0 1 1 22.8 13.4" fill="none" stroke="url(#zg)" stroke-width="5" stroke-linecap="round"/>
  <!-- the task: a check whose long stroke rises toward the zenith -->
  <path d="M22 36.5 L29 43.5 L42.5 27" fill="none" stroke="url(#zg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- zenith: the highest point, straight above the observer -->
  <circle cx="32" cy="7.5" r="3.6" fill="#EE6FF8"/>
</svg>
